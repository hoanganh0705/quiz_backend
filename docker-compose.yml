services:
  postgres:
    image: postgres:18
    container_name: quizdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quizdb}
    ports:
      - "5432:5432"
    volumes:
      - quizdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quizdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: quizredis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - quizredis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiz_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/quizdb
      REDIS_URL: redis://redis:6379
      PORT: 8080
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  quizdb_data:
  quizredis_data:


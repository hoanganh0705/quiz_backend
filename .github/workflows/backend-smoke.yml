name: Backend smoke

on:
  push:
    branches: [main]
    paths:
      - 'quiz_backend/**'
  pull_request:
    paths:
      - 'quiz_backend/**'

# Cancel in-progress runs of the same workflow on the same ref.
concurrency:
  group: backend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Backend smoke gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quizdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/quizdb
      REDIS_URL: redis://localhost:6379
      NODE_ENV: development
      PORT: 8080
      JWT_ACCESS_TOKEN_SECRET: ci-dummy-secret-do-not-use-in-prod-aaaaaaaaaaaaaa
      JWT_REFRESH_TOKEN_SECRET: ci-dummy-secret-do-not-use-in-prod-bbbbbbbbbbbbbb
      JWT_ACCESS_TOKEN_ISSUER: quiz-backend
      JWT_ACCESS_TOKEN_AUDIENCE: quiz-client
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      REFRESH_TOKEN_COOKIE_MAX_AGE_MS: 604800000
      MAX_ACTIVE_SESSIONS_PER_USER: 5
      REFRESH_TOKEN_REUSE_GRACE_WINDOW_SECONDS: 10
      SESSION_BINDING_STRICT: false
      EMAIL_VERIFICATION_TOKEN_TTL_SECONDS: 3600
      EMAIL_VERIFICATION_BASE_URL: http://localhost:8080/api/auth/verify-email
      PASSWORD_RESET_TOKEN_TTL_SECONDS: 3600
      PASSWORD_RESET_BASE_URL: http://localhost:3000/reset-password
      EMAIL_FROM_ADDRESS: onboarding@resend.dev
      EMAIL_FROM_NAME: Quiz App Support
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_ci_dummy_key
      TRUST_PROXY: 'true'
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_NAME: Quiz API
      APP_VERSION: 1.0.0-ci
      APP_DESCRIPTION: REST API for the quiz application (CI build)
      APP_URL: http://localhost:8080
      SWAGGER_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: quiz_backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: quiz_backend
        run: pnpm install --frozen-lockfile

      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in 30s" >&2
          exit 1

      - name: Wait for Redis
        run: |
          for _ in $(seq 1 30); do
            if redis-cli -h localhost -p 6379 ping | grep -q PONG; then
              echo "redis ready"
              exit 0
            fi
            sleep 1
          done
          echo "redis did not become ready in 30s" >&2
          exit 1

      - name: Apply Drizzle migrations
        working-directory: quiz_backend
        run: pnpm db:migrate

      - name: Start backend
        working-directory: quiz_backend
        run: |
          nohup pnpm start:dev > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "backend started as ${BACKEND_PID}"
          # Wait up to 90s for the health endpoint to respond.
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready in 90s; last 50 log lines:" >&2
          tail -n 50 /tmp/backend.log >&2 || true
          exit 1

      - name: Run smoke gate
        working-directory: quiz_backend
        run: bash scripts/smoke.sh

      - name: Dump backend log on failure
        if: failure()
        working-directory: quiz_backend
        run: |
          echo "::group::backend log (last 200 lines)"
          tail -n 200 /tmp/backend.log || true
          echo "::endgroup::"

      - name: Tear down backend
        if: always()
        working-directory: quiz_backend
        run: |
          pkill -f "nest start" || true
          pkill -f "node.*dist/main" || true
